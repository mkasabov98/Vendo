<p-button (onClick)="registerModalVisible = true" [styleClass]="isMobile ? 'w-full' : ''">Register</p-button>

@if (!isMobile) {
    <p-dialog
        header="Register"
        [modal]="true"
        [(visible)]="registerModalVisible"
        [dismissableMask]="true"
        [style]="{ width: '30rem' }"
        (onHide)="onCloseRegisterFrom()"
    >
        <form [formGroup]="registerForm" (ngSubmit)="onRegisterFormSubmit()" class="register-form">
            <p-floatLabel variant="on">
                <input pInputText id="reg-email-d" type="email" formControlName="email" class="w-full" />
                <label for="reg-email-d">Email</label>
            </p-floatLabel>
            <p-floatLabel variant="on">
                <p-password id="reg-pw-d" formControlName="password"
                    [toggleMask]="true" [feedback]="false"
                    styleClass="w-full" inputStyleClass="w-full" />
                <label for="reg-pw-d">Password</label>
            </p-floatLabel>
            <p-floatLabel variant="on">
                <p-password id="reg-confirm-d" formControlName="confirmPassword"
                    [toggleMask]="true" [feedback]="false"
                    styleClass="w-full" inputStyleClass="w-full"
                    (keydown.enter)="onRegisterFormSubmit()" />
                <label for="reg-confirm-d">Confirm Password</label>
            </p-floatLabel>
            @if (formErrors.length) {
                <div class="error-list">
                    @for (err of formErrors; track err) {
                        <p class="error-item"><i class="pi pi-exclamation-circle"></i> {{ err }}</p>
                    }
                </div>
            }
            <div class="form-actions">
                <p-button type="submit" [loading]="isLoading">Register</p-button>
            </div>
        </form>
    </p-dialog>
}

@if (isMobile) {
    <p-drawer
        [(visible)]="registerModalVisible"
        position="bottom"
        styleClass="mobile-form-drawer"
        (onHide)="onCloseRegisterFrom()"
    >
        <ng-template #header>
            <span class="drawer-form-title">Register</span>
        </ng-template>
        <form [formGroup]="registerForm" (ngSubmit)="onRegisterFormSubmit()" class="register-form">
            <p-floatLabel variant="on">
                <input pInputText id="reg-email-m" type="email" formControlName="email" class="w-full" />
                <label for="reg-email-m">Email</label>
            </p-floatLabel>
            <p-floatLabel variant="on">
                <p-password id="reg-pw-m" formControlName="password"
                    [toggleMask]="true" [feedback]="false"
                    styleClass="w-full" inputStyleClass="w-full" />
                <label for="reg-pw-m">Password</label>
            </p-floatLabel>
            <p-floatLabel variant="on">
                <p-password id="reg-confirm-m" formControlName="confirmPassword"
                    [toggleMask]="true" [feedback]="false"
                    styleClass="w-full" inputStyleClass="w-full"
                    (keydown.enter)="onRegisterFormSubmit()" />
                <label for="reg-confirm-m">Confirm Password</label>
            </p-floatLabel>
            @if (formErrors.length) {
                <div class="error-list">
                    @for (err of formErrors; track err) {
                        <p class="error-item"><i class="pi pi-exclamation-circle"></i> {{ err }}</p>
                    }
                </div>
            }
            <div class="form-actions form-actions--mobile">
                <p-button type="submit" [loading]="isLoading" styleClass="w-full">Register</p-button>
            </div>
        </form>
    </p-drawer>
}
