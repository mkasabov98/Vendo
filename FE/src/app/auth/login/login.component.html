<p-button (onClick)="visible = true" [styleClass]="isMobile ? 'w-full' : ''">Login</p-button>

@if (!isMobile) {
    <p-dialog
        header="Log in"
        [modal]="true"
        [(visible)]="visible"
        [dismissableMask]="true"
        [style]="{ width: '28rem' }"
        (onHide)="onHideDialog()"
    >
        <form [formGroup]="loginForm" (ngSubmit)="onFormSubmit()" class="login-form">
            <p-floatLabel variant="on">
                <input pInputText id="login-email-d" type="email" formControlName="email" class="w-full" />
                <label for="login-email-d">Email</label>
            </p-floatLabel>
            <p-floatLabel variant="on">
                <p-password id="login-pw-d" formControlName="password"
                    [toggleMask]="true" [feedback]="false"
                    styleClass="w-full" inputStyleClass="w-full"
                    (keydown.enter)="onFormSubmit()" />
                <label for="login-pw-d">Password</label>
            </p-floatLabel>
            <div class="form-actions">
                <p-button type="submit" [disabled]="loginForm.invalid || isLoading" [loading]="isLoading">Log in</p-button>
            </div>
        </form>
    </p-dialog>
}

@if (isMobile) {
    <p-drawer
        [(visible)]="visible"
        position="bottom"
        styleClass="mobile-form-drawer"
        (onHide)="onHideDialog()"
    >
        <ng-template #header>
            <span class="drawer-form-title">Log in</span>
        </ng-template>
        <form [formGroup]="loginForm" (ngSubmit)="onFormSubmit()" class="login-form">
            <p-floatLabel variant="on">
                <input pInputText id="login-email-m" type="email" formControlName="email" class="w-full" />
                <label for="login-email-m">Email</label>
            </p-floatLabel>
            <p-floatLabel variant="on">
                <p-password id="login-pw-m" formControlName="password"
                    [toggleMask]="true" [feedback]="false"
                    styleClass="w-full" inputStyleClass="w-full"
                    (keydown.enter)="onFormSubmit()" />
                <label for="login-pw-m">Password</label>
            </p-floatLabel>
            <div class="form-actions form-actions--mobile">
                <p-button type="submit" [disabled]="loginForm.invalid || isLoading" [loading]="isLoading" styleClass="w-full">Log in</p-button>
            </div>
        </form>
    </p-drawer>
}
