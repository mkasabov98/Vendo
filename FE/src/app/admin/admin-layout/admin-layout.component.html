<div class="admin-shell">
    <aside class="admin-sidebar">
        <div class="sidebar-logo">
            <i class="pi pi-shopping-bag"></i>
            <span>Admin Panel</span>
        </div>

        <nav class="sidebar-nav">
            <a class="nav-item" routerLink="/admin/dashboard" routerLinkActive="active">
                <i class="pi pi-chart-bar"></i>
                <span>Dashboard</span>
            </a>
            <a class="nav-item" routerLink="/admin/analytics" routerLinkActive="active">
                <i class="pi pi-chart-line"></i>
                <span>Analytics</span>
            </a>
            <a class="nav-item" routerLink="/admin/products" routerLinkActive="active">
                <i class="pi pi-box"></i>
                <span>Products</span>
            </a>
            <a class="nav-item" routerLink="/admin/categories" routerLinkActive="active">
                <i class="pi pi-tag"></i>
                <span>Categories</span>
            </a>
            <a class="nav-item" routerLink="/admin/orders" routerLinkActive="active">
                <i class="pi pi-receipt"></i>
                <span>Orders</span>
            </a>
            <button class="nav-item nav-group-toggle" (click)="toggleUsers()" [class.expanded]="usersExpanded">
                <i class="pi pi-users"></i>
                <span>Users</span>
                <i class="pi pi-chevron-down nav-chevron"></i>
            </button>
            @if (usersExpanded) {
                <a class="nav-item nav-sub" routerLink="/admin/users/customers" routerLinkActive="active">
                    <i class="pi pi-user"></i>
                    <span>Customers</span>
                </a>
                <a class="nav-item nav-sub" routerLink="/admin/users/admins" routerLinkActive="active">
                    <i class="pi pi-shield"></i>
                    <span>Admins</span>
                </a>
            }
        </nav>

        <div class="sidebar-user">
            <i class="pi pi-user-circle"></i>
            <span class="sidebar-user-email">{{ userEmail }}</span>
        </div>

        <button class="sidebar-logout" (click)="logout()">
            <i class="pi pi-sign-out"></i>
            <span>Logout</span>
        </button>
    </aside>

    <main class="admin-content">
        <router-outlet></router-outlet>
    </main>
</div>
